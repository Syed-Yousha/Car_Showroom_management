name: inam_motors_system
description: Inam Motors Car Showroom Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  fluent_ui: ^4.13.0
  pdf: ^3.11.2
  printing: ^5.14.2
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  # Stay on 6.x — writes work fine. Reads via SDK crash the Windows C++
  # SDK on this build; we use the Firestore REST API (services/firestore_rest.dart)
  # for reads instead. (5.x family fails to compile on Windows due to a
  # Firebase C++ SDK / plugin version mismatch in `UpdateEmail`.)
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.2.0
  firebase_storage: ^13.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
